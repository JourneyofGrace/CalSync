name: PlanCent to Off365 Calendar Sync

on:
  schedule:
    # Triggers exactly once per hour
    - cron: '0 * * * *'
  workflow_dispatch: # Keeps the manual button active

jobs:
  sync_loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests msal icalendar

      - name: Execute Sync Cycles
        env:
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TARGET_MAILBOX: ${{ secrets.TARGET_MAILBOX }}
        run: |
          # Single clean pass: re-link on first run, then pure updates/purges
          python plancal_sync.py
